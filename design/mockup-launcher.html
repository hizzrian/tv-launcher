<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup Launcher TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ease: cubic-bezier(.2,.8,.2,1); --tw: 312px; --th: 188px; --gap: 36px; }
  html, body { margin: 0; height: 100%; background: #0a0a0c; overflow: hidden;
    font-family: Inter, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .stage { position: fixed; inset: 0 0 44px 0; }
  .tv { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; overflow: hidden;
    border-radius: 8px; box-shadow: 0 0 0 10px #151517, 0 40px 120px rgba(0,0,0,.6);
    background: radial-gradient(70% 70% at 70% 40%, #1b2a4a, #05070d 75%); }

  /* ---------- Hero (rotating artwork) ---------- */
  .hero { position: absolute; inset: 0; transition: filter .8s var(--ease), transform .8s var(--ease); }
  .tv.grid .hero { filter: blur(40px) brightness(.5) saturate(1.3); transform: scale(1.08); }
  .slide { position: absolute; inset: 0; background-size: cover; background-position: center 30%;
    opacity: 0; transition: opacity 1.1s ease; will-change: opacity, transform; }
  .slide.on { opacity: 1; }
  .slide.kb { animation: kb 11s linear forwards; }
  @keyframes kb {
    from { transform: scale(1.02) translate3d(calc(var(--dx) * -1), 0, 0); }
    to   { transform: scale(1.10) translate3d(var(--dx), var(--dy), 0); }
  }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 48%),
                linear-gradient(to right, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 42%),
                linear-gradient(to bottom, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 18%); }

  .title { position: absolute; left: 110px; top: 110px; z-index: 2; width: 760px;
    transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .tv.grid .title { opacity: 0; transform: translateY(-30px); }
  .title .logo { display: block; max-width: 640px; max-height: 210px; object-fit: contain; object-position: left bottom;
    filter: drop-shadow(0 6px 30px rgba(0,0,0,.45)); }
  .title h1 { margin: 0; font-size: 110px; line-height: .95; font-weight: 900; letter-spacing: -.04em;
    text-shadow: 0 6px 40px rgba(0,0,0,.45); }
  .title p { margin: 22px 0 0; font-size: 26px; font-weight: 500; color: rgba(255,255,255,.82);
    text-shadow: 0 2px 12px rgba(0,0,0,.5); display: flex; gap: 14px; align-items: center; }
  .title p .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.6); }
  .title p .star { color: #ffd34d; }
  .title.out { opacity: 0; transform: translateY(10px); transition: opacity .45s ease, transform .45s ease; }

  .chev { position: absolute; top: 30px; left: 50%; z-index: 3; width: 34px; height: 12px; transform: translateX(-50%);
    transition: opacity .4s; }
  .tv.grid .chev { opacity: 0; }

  .glass { background: linear-gradient(180deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.08) 100%);
    backdrop-filter: blur(42px) saturate(185%); -webkit-backdrop-filter: blur(42px) saturate(185%);
    border: 1.5px solid rgba(255,255,255,.26);
    box-shadow: inset 0 1.5px 1px rgba(255,255,255,.55), inset 0 -1px 1px rgba(255,255,255,.14),
                inset 0 0 50px rgba(255,255,255,.07), 0 24px 70px rgba(0,0,0,.28); }
  .clock { position: absolute; top: 46px; right: 70px; z-index: 3; font-size: 26px; font-weight: 600;
    padding: 12px 24px; border-radius: 999px; }

  /* ---------- Content ---------- */
  .content { position: absolute; left: 0; right: 0; top: 0; z-index: 2; transition: transform .65s var(--ease); }
  .dock { position: absolute; left: 72px; width: 1776px; top: 628px; height: 260px; border-radius: 44px; }
  .dock::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(60% 120% at 12% -10%, rgba(255,255,255,.26), transparent 55%),
                radial-gradient(40% 90% at 95% 120%, rgba(255,255,255,.12), transparent 60%); }
  .tv.grid .dock { background: linear-gradient(180deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.05) 100%); }

  .row { position: absolute; left: 0; right: 0; display: flex; gap: var(--gap); padding-left: 108px; }
  .tile { flex: none; width: var(--tw); height: var(--th); border-radius: 30px; position: relative;
    transition: transform .35s var(--ease); }
  .face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; display: grid; place-items: center;
    box-shadow: 0 8px 22px rgba(0,0,0,.28); transition: box-shadow .35s var(--ease); }
  .face::before { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.04) 46%, rgba(0,0,0,.06) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.12); }
  .face::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.38), transparent); transform: skewX(-18deg); opacity: 0; }
  .tile.focus { transform: scale(1.15) translateY(-6px); z-index: 3; }
  .tile.focus .face { box-shadow: 0 36px 70px rgba(0,0,0,.55), 0 0 0 2.5px rgba(255,255,255,.55), 0 0 40px rgba(255,255,255,.18); }
  .tile.focus .face::after { animation: sheen .9s var(--ease) .05s; }
  @keyframes sheen { 0% { left: -60%; opacity: 1; } 100% { left: 130%; opacity: 0; } }
  .wm { position: relative; z-index: 1; font-weight: 800; font-size: 40px; letter-spacing: -.01em; text-align: center; line-height: 1; padding: 0 18px; }
  .label { position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-size: 22px; font-weight: 600; opacity: 0; transition: opacity .25s; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .tv.grid .tile.focus .label { opacity: 1; }

  .toast { position: absolute; left: 50%; top: 70px; transform: translate(-50%, -20px); z-index: 5;
    padding: 18px 34px; border-radius: 999px; font-size: 28px; font-weight: 600; opacity: 0;
    transition: opacity .3s, transform .3s var(--ease); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .hint { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: center;
    justify-content: center; gap: 26px; font-size: 13px; color: #9a9aa2; }
  .hint kbd { font-family: inherit; font-size: 12px; padding: 3px 7px; border-radius: 6px; background: #1f1f23;
    color: #ddd; border: 1px solid #2c2c31; margin-right: 6px; }
</style>
</head>
<body>
<div class="stage"><div class="tv" id="tv">
  <div class="hero" id="hero">
    <div class="slide" id="slideA"></div>
    <div class="slide" id="slideB"></div>
    <div class="shade"></div>
  </div>
  <svg class="chev" viewBox="0 0 34 12"><path d="M2 10 L17 2 L32 10" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="title" id="title"></div>
  <div class="clock glass" id="clock"></div>
  <div class="content" id="content"><div class="dock glass"></div></div>
  <div class="toast glass" id="toast"></div>
</div></div>
<div class="hint"><span><kbd>← → ↑ ↓</kbd>pindah</span><span><kbd>Enter</kbd>buka</span><span>Latar berganti otomatis tiap 8 detik</span></div>

<script>
/* ---------------- Apps ---------------- */
const play = c => '<span style="width:64px;height:44px;border-radius:13px;background:' + c + ';display:grid;place-items:center"><span style="border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px"></span></span>';
const apps = [
  { name: 'Netflix', tile: 'linear-gradient(160deg,#1c1c1e,#000)', wm: '<span style="color:#e50914;font-size:48px;letter-spacing:.02em">NETFLIX</span>' },
  { name: 'YouTube', tile: 'linear-gradient(160deg,#ffffff,#e9e9ee)', wm: '<span style="display:flex;align-items:center;gap:12px;color:#0f0f0f">' + play('#ff0033') + 'YouTube</span>' },
  { name: 'Disney+', tile: 'linear-gradient(150deg,#0a1440,#0e3fa8 60%,#13a4c9)', wm: '<span style="font-size:50px">Disney+</span>' },
  { name: 'Prime Video', tile: 'linear-gradient(160deg,#1a2a38,#0b141c)', wm: '<span style="color:#38b6f0;font-size:44px">prime video</span>' },
  { name: 'Spotify', tile: 'linear-gradient(160deg,#2a2a2a,#0d0d0d)', wm: '<span style="color:#1ed760;font-size:48px">Spotify</span>' },
  { name: 'YouTube Music', tile: 'linear-gradient(150deg,#ff3a5c,#c4002b)', wm: '<span style="display:flex;align-items:center;gap:12px"><span style="width:42px;height:42px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center"><span style="border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px"></span></span>Music</span>' },
  { name: 'Play Store', tile: 'linear-gradient(150deg,#3ddc84,#1a73e8)', wm: '<span style="font-size:42px">Play Store</span>' },
  { name: 'Google TV', tile: 'linear-gradient(150deg,#ffcf3f,#ff8a00)', wm: '<span style="font-size:42px;color:#2a1600">Google TV</span>' },
  { name: 'Live TV', tile: 'linear-gradient(150deg,#ff6a3d,#e0115f)', wm: '<span style="font-size:46px">Live TV</span>' },
  { name: 'CatchPlay+', tile: 'linear-gradient(150deg,#ff4f9a,#9b1fe8)', wm: '<span style="font-size:40px">CATCHPLAY+</span>' },
  { name: 'Galeri', tile: 'linear-gradient(150deg,#8c7bff,#4b3fd8)', wm: '<span style="font-size:46px">Galeri</span>' },
  { name: 'Media', tile: 'linear-gradient(150deg,#2fe0b0,#0f8f8a)', wm: '<span style="font-size:46px">Media</span>' },
  { name: 'Play Games', tile: 'linear-gradient(150deg,#46e07a,#0a8f5a)', wm: '<span style="font-size:42px">Play Games</span>' },
];

const COLS = 5, DOCK_Y = 628, DOCK_PAD = 36, ROW_H = 296;
const tv = document.getElementById('tv'), content = document.getElementById('content');
const nRows = Math.ceil(apps.length / COLS);
let idx = 0;

for (let r = 0; r < nRows; r++) {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.top = (r === 0 ? DOCK_Y + DOCK_PAD : DOCK_Y + 260 + 46 + (r - 1) * ROW_H) + 'px';
  apps.slice(r * COLS, r * COLS + COLS).forEach(a => {
    const t = document.createElement('div');
    t.className = 'tile';
    t.innerHTML = '<div class="face" style="background:' + a.tile + '"><div class="wm">' + a.wm + '</div></div><div class="label">' + a.name + '</div>';
    row.appendChild(t); a.tileEl = t;
  });
  content.appendChild(row);
}

function render() {
  const r = Math.floor(idx / COLS);
  apps.forEach((a, i) => a.tileEl.classList.toggle('focus', i === idx));
  tv.classList.toggle('grid', r > 0);
  content.style.transform = r === 0 ? 'none' : 'translateY(' + (-(DOCK_Y - 110) - (r - 1) * ROW_H) + 'px)';
}

/* ---------------- Rotating hero ---------------- */
const HOLD = 8000, FADE = 1100;
const CATALOGS = [
  'https://cinemeta-catalogs.strem.io/top/catalog/movie/top.json',
  'https://cinemeta-catalogs.strem.io/top/catalog/series/top.json',
];
let slides = [], cur = -1, front = 'A', timer = null;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const loadImg = url => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(url); i.onerror = fail; i.src = url; });

async function loadCatalog() {
  const lists = await Promise.all(CATALOGS.map(u => fetch(u).then(r => r.json()).then(d => d.metas || []).catch(() => [])));
  const clean = lists.map(l => shuffle(l.filter(m =>
    m.background && /^tt\d+$/.test(m.id) && !(m.genres || []).some(g => /adult/i.test(g)))).slice(0, 12));
  const out = [];
  for (let i = 0; i < 12; i++) clean.forEach(l => l[i] && out.push(l[i]));
  return out.map(m => ({
    name: m.name, type: m.type === 'series' ? 'Serial' : 'Film',
    year: (m.releaseInfo || '').replace(/–$/, ''), genres: (m.genres || []).slice(0, 2).join(', '),
    rating: m.imdbRating,
    bg: m.background.replace('/medium/', '/large/'), logo: m.logo ? m.logo.replace('/medium/', '/large/') : null,
  }));
}

function titleHTML(s, logoOk) {
  const meta = [s.type, s.year, s.genres].filter(Boolean).map(x => '<span>' + x + '</span>').join('<span class="dot"></span>');
  const star = s.rating ? '<span class="dot"></span><span><span class="star">★</span> ' + s.rating + '</span>' : '';
  return (logoOk ? '<img class="logo" src="' + s.logo + '" alt="' + s.name + '">' : '<h1>' + s.name + '</h1>') + '<p>' + meta + star + '</p>';
}

async function show(i) {
  const s = slides[i];
  try { await loadImg(s.bg); } catch { return schedule(500, i + 1); }
  let logoOk = false;
  if (s.logo) { try { await loadImg(s.logo); logoOk = true; } catch {} }

  const next = front === 'A' ? 'B' : 'A';
  const nEl = document.getElementById('slide' + next), oEl = document.getElementById('slide' + front);
  nEl.style.backgroundImage = 'url("' + s.bg + '")';
  const dir = Math.random() < .5 ? -1 : 1;
  nEl.style.setProperty('--dx', (dir * 1.6) + '%'); nEl.style.setProperty('--dy', (Math.random() * -1.2) + '%');
  nEl.classList.remove('kb'); void nEl.offsetWidth; nEl.classList.add('kb', 'on');
  oEl.classList.remove('on');
  front = next; cur = i;

  const t = document.getElementById('title');
  t.classList.add('out');
  setTimeout(() => { t.innerHTML = titleHTML(s, logoOk); t.classList.remove('out'); }, 450);
  schedule(HOLD + FADE);
}

function schedule(ms, i) {
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (tv.classList.contains('grid') || document.hidden) return schedule(1000, i);   // jeda saat di grid
    show(((i ?? cur + 1) % slides.length + slides.length) % slides.length);
  }, ms);
}

(async () => {
  slides = await loadCatalog();
  if (slides.length) show(0);
  else document.getElementById('title').innerHTML = '<h1>Selamat datang</h1><p>Katalog tidak bisa dimuat</p>';
})();

/* ---------------- Input ---------------- */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
}
document.addEventListener('keydown', e => {
  const c = idx % COLS;
  if (e.key === 'ArrowRight' && c < COLS - 1 && idx + 1 < apps.length) idx++;
  else if (e.key === 'ArrowLeft' && c > 0) idx--;
  else if (e.key === 'ArrowDown' && idx + COLS < apps.length) idx += COLS;
  else if (e.key === 'ArrowDown' && Math.floor(idx / COLS) < nRows - 1) idx = apps.length - 1;
  else if (e.key === 'ArrowUp' && idx - COLS >= 0) idx -= COLS;
  else if (e.key === 'Enter') { toast('Membuka ' + apps[idx].name + '…'); e.preventDefault(); return; }
  else return;
  e.preventDefault(); render();
});

function fit() {
  const s = Math.min((innerWidth - 40) / 1920, (innerHeight - 84) / 1080);
  tv.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
}
addEventListener('resize', fit); fit();
function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':'); }
setInterval(tick, 10000); tick();
render();
</script>
</body>
</html>
